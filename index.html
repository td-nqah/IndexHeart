<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I love you &lt;3</title>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
}
canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
}
</style>
</head>
<body>
<canvas id="canvas" width="2000" height="1200"></canvas>

<script>
"use strict";

const WIDTH = 2000;
const HEIGHT = 1200;
const BACKGROUND_COLOR = [0, 0, 0];
const FPS = 60;
const SPEED = 1;
const SCALE = 20;

const WORDS = ["I Love You", "I Love You", "I Love You"];
const FILL_WORDS = ["I LOVE U", "I LOVE U", "I LOVE U"];
const CENTER_TEXT = " I LOVE YOU ";

const COLORS = [
    [255, 182, 193],
    [255, 192, 203],
    [255, 174, 185],
    [255, 160, 180],
    [250, 180, 200]
];

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });

const glowCanvas = document.createElement("canvas");
glowCanvas.width = WIDTH;
glowCanvas.height = HEIGHT;
const glowCtx = glowCanvas.getContext("2d");

const textCanvas = document.createElement("canvas");
textCanvas.width = WIDTH;
textCanvas.height = HEIGHT;
const textCtx = textCanvas.getContext("2d");

function randChoice(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function randUniform(a, b) {
    return a + Math.random() * (b - a);
}

function randInt(a, b) {
    return Math.floor(Math.random() * (b - a + 1)) + a;
}

function heart_xy(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);
    return [x, -y];
}

function to_screen(x, y) {
    return [
        x * SCALE + WIDTH / 2,
        y * SCALE + HEIGHT / 2
    ];
}

class Particle {
    constructor(x, y, order, kind) {
        this.x = x;
        this.y = y;
        this.order = order;
        this.kind = kind;

        this.word = kind === "fill"
            ? randChoice(FILL_WORDS)
            : randChoice(WORDS);

        this.color = randChoice(COLORS);
        this.alpha = 0;
        this.flicker = randUniform(0, Math.PI * 2);
        this.font = null;
        this.delay = 0;
        this.size_mult = randUniform(0.85, 1.15);
    }
}

function build_outline_particles(n_outline, min_gap = 30) {
    const particles = [];
    const placed = [];

    for (let i = 0; i < n_outline; i++) {
        const t = (i / n_outline) * 2 * Math.PI;
        const [bx, by] = heart_xy(t);
        const [sx, sy] = to_screen(bx, by);

        let tooClose = false;
        for (const [px, py] of placed) {
            if (Math.hypot(sx - px, sy - py) < min_gap) {
                tooClose = true;
                break;
            }
        }
        if (tooClose) continue;

        placed.push([sx, sy]);
        particles.push(new Particle(sx, sy, i, "outline"));
    }

    return particles;
}

function build_fill_particles(n_fill, min_gap = 46) {
    const particles = [];
    const placed = [];

    let attempts = 0;
    const max_attempts = n_fill * 80;

    while (particles.length < n_fill && attempts < max_attempts) {
        attempts++;

        const t = randUniform(0, 2 * Math.PI);
        const r = randUniform(0.0, 0.86);

        const [bx, by] = heart_xy(t);

        const px = bx * r;
        const py = by * r;

        const [sx, sy] = to_screen(px, py);

        let tooClose = false;
        for (const [qx, qy] of placed) {
            if (Math.hypot(sx - qx, sy - qy) < min_gap) {
                tooClose = true;
                break;
            }
        }
        if (tooClose) continue;

        placed.push([sx, sy]);
        particles.push(new Particle(sx, sy, particles.length, "fill"));
    }

    return particles;
}

/*
 * Python pygame uses Arial Bold:
 *   outline = 20
 *   fill    = 17
 *   center  = 50
 *
 * Canvas uses Arial Bold with matching pixel sizes.
 */
const font_outline = "bold 20px Arial";
const font_fill = "bold 17px Arial";
const font_center = "bold 50px Arial";

function drawGlowText(glowLayer, screenLayer, font, word, color, x, y, alpha, size_mult = 1.0) {
    if (alpha <= 0) return;

    const rgb = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;

    let actualFont = font;
    if (size_mult !== 1.0) {
        const sizeMatch = font.match(/(\d+)px/);
        const baseSize = sizeMatch ? Number(sizeMatch[1]) : 20;
        actualFont = `bold ${Math.floor(baseSize * size_mult)}px Arial`;
    }

    // Main text
    screenLayer.save();
    screenLayer.font = actualFont;
    screenLayer.textAlign = "center";
    screenLayer.textBaseline = "middle";
    screenLayer.globalAlpha = alpha / 255;
    screenLayer.fillStyle = rgb;
    screenLayer.fillText(word, x, y);
    screenLayer.restore();

    if (alpha > 10) {
        // Large glow: pygame smoothscale 2.4x, alpha // 7
        glowLayer.save();
        glowLayer.font = actualFont;
        glowLayer.textAlign = "center";
        glowLayer.textBaseline = "middle";
        glowLayer.globalAlpha = Math.max(0, Math.floor(alpha / 7)) / 255;
        glowLayer.fillStyle = rgb;

        // Approximate the enlarged text surface while keeping the same center.
        glowLayer.save();
        glowLayer.translate(x, y);
        glowLayer.scale(2.4, 2.4);
        glowLayer.fillText(word, 0, 0);
        glowLayer.restore();

        // Small glow: pygame smoothscale 1.6x, alpha // 3
        glowLayer.globalAlpha = Math.max(0, Math.floor(alpha / 3)) / 255;
        glowLayer.save();
        glowLayer.translate(x, y);
        glowLayer.scale(1.6, 1.6);
        glowLayer.fillText(word, 0, 0);
        glowLayer.restore();

        glowLayer.restore();
    }
}

// Match the Python initialization order.
const outline = build_outline_particles(160);
const fill = build_fill_particles(130);

const outline_span = outline.length
    ? Math.max(...outline.map(p => p.order))
    : 0;

const frames_per_step = 1;

const fill_start_frame =
    Math.floor(outline_span * frames_per_step) + 0;

for (const p of fill) {
    p.delay = fill_start_frame + p.order;
}

for (const p of outline) {
    p.delay = Math.floor(p.order * frames_per_step);
}

const particles = outline.concat(fill);

for (const p of particles) {
    p.font = p.kind === "outline" ? font_outline : font_fill;
}

let frame = 0.0;
let running = true;

// Canvas equivalent of the Python black background.
ctx.fillStyle = "rgb(0,0,0)";
ctx.fillRect(0, 0, WIDTH, HEIGHT);

// The original runs at 80 FPS. Use a fixed animation step of SPEED
// while rendering at the browser's available refresh rate.
const FRAME_MS = 1000 / FPS;
let lastTime = performance.now();
let accumulator = 0;

function render() {
    if (!running) return;

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgb(0,0,0)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    glowCtx.clearRect(0, 0, WIDTH, HEIGHT);
    textCtx.clearRect(0, 0, WIDTH, HEIGHT);

    const now = performance.now();
    const deltaTime = (now - lastTime) / 1000;
    lastTime = now;
    
    frame += SPEED * deltaTime * FPS;

    for (const p of particles) {
        if (frame > p.delay && p.alpha < 255) {
            const fade_speed = (14 + randInt(0, 4)) * SPEED;
            p.alpha = Math.min(255, p.alpha + fade_speed);
        }

        let flick;
        if (p.alpha >= 255) {
            flick =
                0.75 +
                0.25 * Math.sin(frame * 0.04 + p.flicker);
        } else {
            flick = 1.0;
        }

        const alpha = Math.floor(p.alpha * flick);
        if (alpha <= 0) continue;

        drawGlowText(
            glowCtx,
            textCtx,
            p.font,
            p.word,
            p.color,
            p.x,
            p.y,
            alpha,
            p.size_mult
        );
    }

    ctx.drawImage(glowCanvas, 0, 0);
    ctx.drawImage(textCanvas, 0, 0);

    const center_start = fill_start_frame + 200;

    if (frame > center_start) {
        const progress = Math.min(1.0, (frame - center_start) / 60);

        const center_alpha = Math.floor(
            255 * (1 - Math.exp(-progress * 8))
        );

        const pulse =
            1.0 +
            0.025 * Math.sin(frame * 0.05);

        ctx.save();
        ctx.translate(WIDTH / 2, HEIGHT / 2);
        ctx.scale(pulse, pulse);

        ctx.font = font_center;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const centerColor = "rgb(255, 192, 203)";

        // Center glow: equivalent visual effect to the pygame 1.4x layer.
        if (center_alpha > 10) {
            ctx.save();
            ctx.globalAlpha = Math.floor(center_alpha / 5) / 255;
            ctx.scale(1.4, 1.4);
            ctx.fillStyle = centerColor;
            ctx.fillText(CENTER_TEXT, 0, 0);
            ctx.restore();
        }

        ctx.globalAlpha = center_alpha / 255;
        ctx.fillStyle = centerColor;
        ctx.fillText(CENTER_TEXT, 0, 0);

        ctx.restore();
    }

    requestAnimationFrame(render);
}

// Start immediately, like the Python program.
requestAnimationFrame(render);

// ESC closes the animation page/window where the browser permits it.
document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
        running = false;
    }
});
</script>
</body>
</html>
